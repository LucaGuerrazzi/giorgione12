<style>
:root{
  --bg:#f6f4f1;--card:#fff;--ink:#1d1b19;--mute:#6b6560;--line:#e6e1db;
  --acc:#c62828;--acc-soft:#fde8e6;--walk:#2e7d32;--walk-soft:#e7f3e8;
  --str:#1565c0;--str-soft:#e5eefa;--rest:#8d8378;--rest-soft:#efebe7;--fast:#ef6c00;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141210;--card:#1f1c19;--ink:#f1ece6;--mute:#a59d94;--line:#332e29;
  --acc:#ef5350;--acc-soft:#3a1d1b;--walk:#66bb6a;--walk-soft:#1d2e1e;
  --str:#64b5f6;--str-soft:#18263a;--rest:#a1978c;--rest-soft:#2a2622;--fast:#ffa726;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  font-size:16px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left));

header .brand{display:flex;align-items:center;gap:10px}

main{max-width:680px;margin:0 auto;padding:0 calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left))}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}

.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:10px}

.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}

.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.k-run .tag{background:var(--acc-soft);color:var(--acc)}
.k-walk .tag{background:var(--walk-soft);color:var(--walk)}
.k-strength .tag{background:var(--str-soft);color:var(--str)}

.k-race .tag{background:var(--acc);color:#fff}
.k-run{border-left:5px solid var(--acc)}.k-walk{border-left:5px solid var(--walk)}
.k-strength{border-left:5px solid var(--str)}.k-rest{border-left:5px solid var(--rest)}.k-race{border-left:5px solid var(--acc)}
.dayc h2{font-size:21px;margin:10px 0 2px;line-height:1.25}

.done input{width:22px;height:22px;accent-color:var(--walk)}

/* Piano */
details.wk{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}

.b-s{background:var(--rest-soft);color:var(--rest)}.b-t{background:var(--acc-soft);color:var(--acc)}.b-r{background:var(--acc);color:#fff}
.drow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--ink);text-align:left;font-size:15px}
.drow .dot{width:10px;height:10px;border-radius:50%;flex:none}

.drow .tt{flex:1}

.drow.today{background:var(--acc-soft)}
.d-run{background:var(--acc)}.d-walk{background:var(--walk)}.d-strength{background:var(--str)}.d-rest{background:var(--line)}.d-race{background:var(--acc)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mute)}

/* Info */
.info h2{font-size:18px;margin:4px 0 8px}

.info p,.info li{font-size:15px}
.info ul,.info ol{padding-left:20px;margin:6px 0}
.info table{width:100%;border-collapse:collapse;font-size:14px}

/* Nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--mute);text-decoration:none;font-size:12px;font-weight:600}
nav a svg{width:24px;height:24px}
nav a.on{color:var(--acc)}
/* Timer */
#timer{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
#timer.on{display:flex}
#timer .top{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
#timer .phase{margin-top:auto;text-align:center}
#timer .phase .what{font-size:30px;font-weight:800}
#timer .phase .clock{font-size:96px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;margin:6px 0}
#timer .phase .nxt{color:var(--mute);font-size:16px}
#timer.t-run .what,#timer.t-run .clock{color:var(--acc)}
#timer.t-walk .what,#timer.t-walk .clock{color:var(--walk)}
#timer.t-fast .what,#timer.t-fast .clock{color:var(--fast)}
#timer .tbar{height:10px;border-radius:10px;background:var(--line);overflow:hidden;margin:22px 0 0}
#timer .tbar i{display:block;height:100%;background:var(--ink);opacity:.55}
#timer .ctrls{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
#timer .ctrls .btn{margin:0}
#timer .ctrls .wide{grid-column:1/3}
#timer .hint{font-size:13px;color:var(--mute);text-align:center;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:30}
.modal.on{display:flex}
.modal .sheet{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
</style>

<body>
<header>
  <div class="brand">
    <div class="logo">12</div>

  </div>
</header>

<main>
  <section id="v-oggi" class="view"></section>
  <section id="v-piano" class="view"></section>

</main>

<nav>

</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
'use strict';
/* ====== DATE ====== */
const DAY = 86400000;
const mk = (y, m, d) => new Date(y, m - 1, d);
const START = mk(2026, 11, 13);       // inizio piano (venerdì)
const RACE = mk(2027, 9, 19);         // gara (domenica)
const MON1 = mk(2026, 11, 9);         // lunedì della settimana 1
const addDays = (dt, n) => { const r = new Date(dt); r.setDate(r.getDate() + n); return r; };
const iso = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const fromIso = s => { const [y, m, d] = s.split('-').map(Number); return mk(y, m, d); };
const today = () => { const n = new Date(); return mk(n.getFullYear(), n.getMonth() + 1, n.getDate()); };
const diffDays = (a, b) => Math.round((b - a) / DAY);
const weekOf = dt => Math.floor(diffDays(MON1, dt) / 7) + 1;
const fmtLong = dt => dt.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const fmtShort = dt => dt.toLocaleDateString('it-IT', { day: 'numeric', month: 'short' });
const fmtDow = dt => dt.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric' });

/* ====== PIANO: [seduta A (mar), seduta B (gio), seduta C (dom), flag, nota] ======
   W = camminata (min) · IrxA/B = r ripetizioni di A sec corsa + B sec cammino
   R = corsa continua (min) · +Sn = n allunghi · K = uscita lunga (km)
   flag: S = scarico, T1..T3 = soglia di controllo */
const WEEKS = [
  ['W30','W30','W30','', "Settimana iniziale ridotta: camminata venerdì 13 e domenica 15. Prenota subito la visita medico-sportiva con ECG da sforzo: la prima corsa è martedì 24 novembre."],
  ['W40','W40','W40','', "Solo camminata. Entro fine settimana devi avere l'esito della visita."],
  ['I8x60/120','I8x60/120','I8x60/120','', "Prima settimana di corsa: corri solo dopo la visita. Ritmo lentissimo."],
  ['I8x90/120','I8x90/120','I8x90/120','', ''],
  ['I6x120/120','I6x120/120','I6x120/120','', "Da questa settimana: forza il lunedì e il venerdì."],
  ['I5x180/120','I5x180/120','I5x180/120','', ''],
  ['I6x120/120','I6x120/120','I6x120/120','S', "Scarico di Natale."],
  ['I4x240/90','I4x240/90','I4x240/90','', ''],
  ['I4x300/60','I4x300/60','I4x300/60','', ''],
  ['I3x420/60','I3x420/60','I3x420/60','', ''],
  ['I4x300/60','I4x300/60','I4x300/60','S', ''],
  ['I2x600/60','I2x600/60','I2x600/60','', ''],
  ['I2x720/60','I2x720/60','I2x720/60','', "Forza: da ora 3 serie da 12."],
  ['R20','I3x480/60','R22','', "Prime corse continue."],
  ['R15','R15','R15','S', ''],
  ['R25','R25','R28','', ''],
  ['R30','R25','R30','T1', "SOGLIA 1: 30 minuti di corsa continua. Se non ci riesci, ripeti le settimane 15–17."],
  ['R30','R30','K4.5','', "Da ora la seduta della domenica si misura in km."],
  ['R30','R35','K5','', ''],
  ['R25','R25','K4','S', ''],
  ['R35','R30','K5.5','', ''],
  ['R35','R35','K6','T2', "SOGLIA 2: 6 km di corsa continua. Domenica cronometra i primi 5 km (test). Se non ci riesci, usa corsa e cammino 9'/1' anche nei lunghi."],
  ['R35','R35','K6.5','', ''],
  ['R30','R30','K5','S', ''],
  ['R40','R35','K7','', "Da ora una domenica su due (questa compresa) corri su un percorso misto con sterrato e selciato, meglio se su tratti della Passeggiata."],
  ['R40','R35','K7.5','', ''],
  ['R40','R40','K8','', "Domenica su percorso misto."],
  ['R30','R30','K6','S', ''],
  ['R40','R40','K8.5','', "Domenica su percorso misto."],
  ['R45','R40','K9','T3', "SOGLIA 3: 9 km, anche con pause camminate. Se non ci riesci, prepara la gara con corsa e cammino senza aumentare il volume."],
  ['R45','R40','K9.5','', "Domenica su percorso misto."],
  ['R35','R35','K7','S', ''],
  ['R45','R40','K10','', "Gara di prova sui 10 km (facoltativa). Domenica cronometra i primi 5 km (test). Da ora nei lunghi bevi ogni 4 km circa."],
  ['R45','R45','K10.5','', ''],
  ['R45','R40','K11','', "Caldo: corri all'alba o la sera tardi e porta acqua. Domenica su percorso misto."],
  ['R35','R35','K8','S', ''],
  ['R45','R45','K11.5','', "Domenica su percorso misto."],
  ['R45','R40','K12','', "Domenica: prima volta sulla distanza della gara."],
  ['R45','R45','K12','', "Domenica su percorso misto."],
  ['R35','R35','K9','S', "Scarico di Ferragosto."],
  ['R45','R45','K12.5','', "Domenica su percorso misto."],
  ['R45','R40','K13','', "Domenica il lungo più lungo del piano."],
  ['R40','R40','K10','', ''],
  ['R35','R30+S4','K8','', "Inizia la riduzione del volume. Forza solo lunedì."],
  ['R30','R20+S3','RACE','', "Settimana della gara: niente forza. Domenica 19 settembre la Passeggiata del Giorgione (nel 2026 il 12 km è partito alle 9:10)."]
];
const NW = WEEKS.length;
function phase(w) {
  if (w <= 2) return 'Camminata';
  if (w <= 13) return 'Corsa e cammino';
  if (w <= 17) return 'Corsa continua';
  if (w <= 30) return 'Costruzione fino a 9 km';
  if (w <= 39) return 'Verso i 12 km';
  if (w <= 43) return 'Consolidamento';
  return 'Riduzione e gara';
}

/* ====== SEDUTE ====== */
function parse(code) {
  let m;
  if (code === 'RACE') return { t: 'race' };
  if ((m = code.match(/^W(\d+)$/))) return { t: 'walk', min: +m[1] };
  if ((m = code.match(/^I(\d+)x(\d+)\/(\d+)$/))) return { t: 'int', reps: +m[1], run: +m[2], walk: +m[3] };
  if ((m = code.match(/^R(\d+)(?:\+S(\d+))?$/))) return { t: 'run', min: +m[1], strides: m[2] ? +m[2] : 0 };
  if ((m = code.match(/^K([\d.]+)$/))) return { t: 'km', km: +m[1] };
  return null;
}
const fs = s => { const m = Math.floor(s / 60), r = s % 60; return m && r ? `${m}'${String(r).padStart(2, '0')}"` : m ? `${m}'` : `${r}"`; };
const kmTxt = k => String(k).replace('.', ',');
function title(p) {
  switch (p.t) {
    case 'walk': return `Camminata a passo svelto · ${p.min} minuti`;
    case 'int': return `${p.reps} × (${fs(p.run)} di corsa + ${fs(p.walk)} di cammino)`;
    case 'run': return `Corsa continua · ${p.min} minuti` + (p.strides ? ` + ${p.strides} allunghi` : '');
    case 'km': return `Uscita lunga · ${kmTxt(p.km)} km`;
    case 'race': return 'GARA · Passeggiata del Giorgione, 12 km';
  }
}
function short(p) {
  switch (p.t) {
    case 'walk': return `Cammino ${p.min}'`;
    case 'int': return `${p.reps}×(${fs(p.run)}/${fs(p.walk)})`;
    case 'run': return `Corsa ${p.min}'` + (p.strides ? ` + ${p.strides} allunghi` : '');
    case 'km': return `Lungo ${kmTxt(p.km)} km`;
    case 'race': return 'GARA 12 km';
  }
}
function segments(p) {
  if (p.t === 'walk') return [{ label: 'Cammino a passo svelto', sec: p.min * 60, k: 'walk' }];
  const s = [{ label: 'Riscaldamento: cammina', sec: 300, k: 'walk' }];
  if (p.t === 'int') for (let i = 1; i <= p.reps; i++) {
    s.push({ label: `Corri · ${i} di ${p.reps}`, sec: p.run, k: 'run' });
    s.push({ label: `Cammina · ${i} di ${p.reps}`, sec: p.walk, k: 'walk' });
  }
  if (p.t === 'run') {
    s.push({ label: 'Corsa continua', sec: p.min * 60, k: 'run' });
    for (let i = 1; i <= p.strides; i++) {
      s.push({ label: `Allungo · ${i} di ${p.strides}`, sec: 20, k: 'fast' });
      s.push({ label: `Recupero camminando · ${i} di ${p.strides}`, sec: 100, k: 'walk' });
    }
  }
  if (p.t === 'km') s.push({ label: `Corri ${kmTxt(p.km)} km`, sec: 0, k: 'run', open: true });
  s.push({ label: 'Defaticamento: cammina', sec: 300, k: 'walk' });
  return s;
}
function steps(p) {
  const warm = "5 minuti di camminata per scaldarti.";
  const cool = "5 minuti di camminata per defaticare, poi 3–5 minuti di allungamento leggero di polpacci, cosce e glutei.";
  switch (p.t) {
    case 'walk': return [`Cammina a passo svelto per ${p.min} minuti: devi respirare più forte del normale ma riuscire a parlare.`, "Scarpe comode, terreno pianeggiante."];
    case 'int': return [warm, `Ripeti ${p.reps} volte: ${fs(p.run)} di corsa molto lenta, poi ${fs(p.walk)} di cammino.`, cool];
    case 'run': {
      const a = [warm, `${p.min} minuti di corsa continua a ritmo conversazionale.`];
      if (p.strides) a.push(`${p.strides} allunghi: 20 secondi a ritmo svelto ma controllato, poi 1'40" camminando.`);
      a.push(cool); return a;
    }
    case 'km': return [warm, `${kmTxt(p.km)} km di corsa a ritmo conversazionale: circa ${Math.round(p.km * 7.5)} minuti a 7:30 al km (STIMA, conta la distanza, non il tempo).`, "Se serve, inserisci 1 minuto di cammino ogni 9 di corsa.", cool];
    case 'race': return [];
  }
}
function totalMin(p) {
  const s = segments(p).reduce((a, x) => a + x.sec, 0);
  return Math.round(s / 60 + (p.t === 'km' ? p.km * 7.5 : 0));
}
function strength(w) {
  const sc = WEEKS[w - 1][3] === 'S';
  const sets = (w < 13 || sc) ? 2 : 3, reps = w < 13 ? 10 : 12, plank = w < 13 ? 20 : (w < 31 ? 30 : 45);
  return { sets, reps, plank, list: [
    ['Squat a corpo libero', `${sets} × ${reps}`, "Piedi alla larghezza delle spalle, scendi come per sederti su una sedia, ginocchia in linea con le punte."],
    ['Affondi alternati', `${sets} × ${reps} per gamba`, "Passo avanti, il ginocchio dietro scende verso terra senza toccarla, busto dritto."],
    ['Sollevamenti sui polpacci', `${sets} × ${reps + 3}`, "Su un gradino: sali sulle punte, poi scendi lentamente in 3 secondi."],
    ['Ponte per i glutei', `${sets} × ${reps}`, "Sdraiato, ginocchia piegate: solleva il bacino e tieni 2 secondi in alto."],

/* ====== GIORNO ====== */
function dayPlan(dt) {
  if (dt < START || dt > RACE) return null;
  const w = weekOf(dt), W = WEEKS[w - 1], dow = dt.getDay();
  let p = null, slot = '';
  if (w === 1) { if (dow === 5 || dow === 0) { p = parse('W30'); slot = ''; } }
  else if (dow === 2) { p = parse(W[0]); slot = 'Seduta A'; }
  else if (dow === 4) { p = parse(W[1]); slot = 'Seduta B'; }
  else if (dow === 0) { p = parse(W[2]); slot = W[2] === 'RACE' ? 'Gara' : 'Seduta C'; }
  if (p) return { w, dow, p, slot, kind: p.t === 'race' ? 'race' : (p.t === 'walk' ? 'walk' : 'run') };
  if ((dow === 1 && w >= 5 && w <= 44) || (dow === 5 && w >= 5 && w <= 43)) return { w, dow, kind: 'strength' };
  return { w, dow, kind: 'rest' };
}
const isTraining = dp => dp && dp.kind !== 'rest';
function shortDay(dp) {
  if (!dp) return '';
  if (dp.p) return short(dp.p);
  if (dp.kind === 'strength') return 'Forza 15–20\'';
  return dp.dow === 6 ? 'Riposo o camminata libera' : 'Riposo';
}

/* ====== VISTA OGGI ====== */

  for (let d = new Date(START); d <= RACE; d = addDays(d, 1)) {

  return { tot, done, due };
}

function weekRows(w) {

/* ====== TIMER ====== */
let T = null, ac = null, wake = null, iv = null;
function tone(freq, dur, when) {
  if (!ac) return;

  o.frequency.value = freq; o.type = 'sine';
  g.gain.setValueAtTime(0.0001, ac.currentTime + when);
  g.gain.exponentialRampToValueAtTime(0.5, ac.currentTime + when + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + when + dur);
  o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + when); o.stop(ac.currentTime + when + dur + 0.05);
}
function signal(k) {
  try {
    if (k === 'run') { tone(880, .18, 0); tone(880, .18, .28); }
    else if (k === 'fast') { tone(1000, .12, 0); tone(1000, .12, .2); tone(1000, .12, .4); }
    else if (k === 'end') { tone(660, .2, 0); tone(880, .2, .25); tone(1100, .4, .5); }
    else tone(520, .5, 0);
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate(k === 'run' ? [200, 100, 200] : k === 'fast' ? [120, 80, 120, 80, 120] : [500]); } catch (e) {}
}
async function keepAwake() {
  try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) { wake = null; }
}
document.addEventListener('visibilitychange', () => { if (T && document.visibilityState === 'visible') { keepAwake(); tick(); } });
const clock = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(r).padStart(2, '0'); };
function startTimer(dp, key) {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; }
  const segs = segments(dp.p);
  T = { segs, i: 0, key, paused: false, end: 0, start: 0, held: 0, total: segs.reduce((a, s) => a + s.sec, 0), title: short(dp.p) };
  beginSeg(Date.now());
  document.getElementById('timer').classList.add('on');
  document.getElementById('t-title').textContent = T.title;
  keepAwake();
  clearInterval(iv); iv = setInterval(tick, 250);
  draw();
}
function beginSeg(base) {
  const s = T.segs[T.i];
  if (s.open) T.start = base; else T.end = base + s.sec * 1000;
  signal(s.k);
}
function advance(base) {
  T.i++;
  if (T.i >= T.segs.length) { finish(); return false; }
  beginSeg(base); return true;
}
function tick() {
  if (!T || T.paused) return;
  let s = T.segs[T.i];
  // recupera il tempo trascorso anche se lo schermo si è spento
  while (s && !s.open && Date.now() >= T.end) {
    if (!advance(T.end)) return;
    s = T.segs[T.i];
  }
  draw();
}
function draw() {
  if (!T) return;
  const s = T.segs[T.i], el = document.getElementById('timer');
  el.className = 'on t-' + s.k;
  document.getElementById('t-what').textContent = s.label;
  document.getElementById('t-step').textContent = `Fase ${T.i + 1} di ${T.segs.length}`;
  let shown, doneSec = T.segs.slice(0, T.i).reduce((a, x) => a + x.sec, 0);
  if (s.open) {
    const el2 = T.paused ? T.held : (Date.now() - T.start) / 1000;
    shown = clock(el2);
    document.getElementById('t-hint').textContent = 'Tempo trascorso. Quando hai finito i km premi Avanti.';
  } else {
    const rem = T.paused ? T.held : (T.end - Date.now()) / 1000;
    shown = clock(Math.ceil(rem));
    doneSec += s.sec - rem;
    document.getElementById('t-hint').textContent = 'Tieni lo schermo acceso: a ogni cambio di fase senti un segnale.';
  }
  document.getElementById('t-clock').textContent = shown;
  const nx = T.segs[T.i + 1];
  document.getElementById('t-next').textContent = nx ? `Poi: ${nx.label}${nx.open ? '' : ' · ' + fs(nx.sec)}` : 'Ultima fase';
  document.getElementById('t-bar').style.width = T.total ? Math.min(100, doneSec / T.total * 100) + '%' : '0';
  document.getElementById('t-pause').textContent = T.paused ? 'Riprendi' : 'Pausa';
}
function finish() {
  clearInterval(iv); signal('end');
  const key = T.key; T = null;
  document.getElementById('timer').classList.remove('on');
  try { if (wake) wake.release(); } catch (e) {} wake = null;
  ask('Seduta completata', 'Vuoi segnarla come fatta?', 'Sì, segna come fatta', () => { setDone(key, true); renderOggi(); });
}
document.getElementById('t-pause').onclick = () => {
  if (!T) return; const s = T.segs[T.i];
  if (!T.paused) { T.held = s.open ? (Date.now() - T.start) / 1000 : (T.end - Date.now()) / 1000; T.paused = true; }
  else { if (s.open) T.start = Date.now() - T.held * 1000; else T.end = Date.now() + T.held * 1000; T.paused = false; }
  draw();
};
document.getElementById('t-skip').onclick = () => { if (!T) return; T.paused = false; if (advance(Date.now())) draw(); };
document.getElementById('t-stop').onclick = () => {
  if (!T) return;
  ask('Terminare la seduta?', 'Il timer si ferma. Potrai comunque segnare la seduta come fatta.', 'Termina', () => {
    clearInterval(iv); T = null; document.getElementById('timer').classList.remove('on');
    try { if (wake) wake.release(); } catch (e) {} wake = null; renderOggi();
  });
};
function ask(t, msg, okTxt, ok) {
  const m = document.getElementById('modal');
  document.getElementById('sheet').innerHTML = `<h2 style="margin:0 0 6px;font-size:19px">${t}</h2><p style="margin:0;color:var(--mute)">${msg}</p>
    <button class="btn" id="m-ok">${okTxt}</button><button class="btn sec" id="m-no">Annulla</button>`;
  m.classList.add('on');
  document.getElementById('m-ok').onclick = () => { m.classList.remove('on'); ok(); };
  document.getElementById('m-no').onclick = () => m.classList.remove('on');
}

/* ====== NAVIGAZIONE ====== */
function route() {
  const v = ['oggi', 'piano', 'info'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'oggi';
  document.querySelectorAll('.view').forEach(e => e.classList.toggle('on', e.id === 'v-' + v));
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.v === v));
  if (v === 'oggi') renderOggi(); else if (v === 'piano') renderPiano(); else renderInfo();
  if (v !== 'piano') window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();

/* ====== OFFLINE (solo se pubblicata su un proprio sito) ====== */
try {
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
} catch (e) {}
</script>
